<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" content="width=device=width, initial-scale1.0">
        <title>Contact | Monzerrat</title>
        <link rel="stylesheet" href="/style.css">
    </head>

    <body class="inner-page contact page">
        <div class="stars"></div>
        <header class="site-header">
            <a class="logo" href="index.html">
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="resume.html">Resume</a>
                <a class="active" href="contact.html">Contact</a>
            </nav>
        </header>

        <main class="page-container narrow contact-wrap">
            <p class="eyebrow">
                ☆ you have reached the end ☆
            </p>

            <h1 class="page-title">
                ☆ wanna chat? ☆
            </h1>

            <p class="page-intro">
                whatevr you wish to chat, i'd love to hear from you!!
            </p>

            <form class="contact-form glass" onsubmit="return sendMessage(event)">

                <label>
                    ☆ Name: 

                <input id="name" type="text" placeholder="Your name" required>
                </label>

                <label>
                    ☆ Email: 

                    <input id="email" type="email" placeholder="you@example.com" required>
                </label>

                <label>
                    ☆ Message: 

                    <textarea id="message" rows="6" placeholder="write sumthing...." required>
                    </textarea>
                </label>

                <button
                    class="button primary" type="submit">
                    ☆ send message ☆
                </button>

                <p id="form-message" class="form-message">
                </p>
            </form>

            <div class="socials">
                <a href="#">
                    ☆ GitHub ☆
                </a>
                <span>⏾</span>

                <a href="#">
                    ☆ LinkedIn ☆
                </a>
                <span>⏾</span>

                <a href="mmejiamendoza04@gmail.com">
                    ☆ Email ☆
                </a>
            </div>
        </main>

        <footer>
            ☆ thank you for visiting my portfolio! ☆
        </footer>
    </body>
</html>
